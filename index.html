<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1E5B">
<title>WD_FUTSAL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#131C2B; --muted:#5D6878; --line:#D6DCE4;
  --accent:#1E46C8; --accent-ink:#FFFFFF; --navy:#0B1E5B; --board:#0D1830; --amber:#FFD21F; --over:#FF6B5A; --danger:#C23B30; --live:#E5483B;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Anton","Black Han Sans",Impact,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root{--bg:#0E1522;--surface:#172031;--ink:#E7ECF3;--muted:#95A1B2;--line:#2A3548;--accent:#6E8FF0;--accent-ink:#0A1226;--board:#070D1A;--danger:#E4675C}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}

/* app bar */
.appbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.appbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.appbar img{width:34px;height:34px;border-radius:50%;background:#fff;flex:none}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl b{display:block;font-family:var(--latin);font-weight:400;font-size:17px;letter-spacing:.5px;line-height:1.08}
.appbar .ttl span:empty{display:none}
.appbar .ttl span{font-size:12px;opacity:.75}
.appbar .back{width:40px;height:40px;border-radius:10px;font-size:22px;color:#fff}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.pill.admin{background:var(--amber);color:#1A1400;font-weight:700}

h2{font-family:var(--display);font-weight:400;font-size:19px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:6px 2px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.bib{display:inline-block;width:12px;height:18px;border-radius:3px 3px 5px 5px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}
.notice{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.notice.warn{border-color:var(--amber)}

/* steps */
.steps{display:flex;gap:4px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:1 0 auto;min-width:60px;min-height:52px;padding:6px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;color:var(--muted)}
.steps button i{font-style:normal;font-family:var(--display);font-size:15px}
.steps button.done{color:var(--ink)}
.steps button.done i::after{content:" ✓";font-size:11px;color:var(--accent)}
.steps button[aria-current=step]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button[aria-current=step] i::after{color:inherit}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:500;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.field{display:grid;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>label,.field>span{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.inp{min-height:110px;resize:vertical;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.chip{min-height:40px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.chip.x::after{content:"×";opacity:.5;font-size:16px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.cap{font-weight:700}
.chip:disabled{opacity:.55;cursor:default}

/* home list */
.card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-bottom:1px solid var(--line);text-align:left;min-height:68px}
.card:last-child{border-bottom:0}
.card .d{font-weight:700}
.card .s{font-size:13px;color:var(--muted)}
.card .r{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);flex:none}
.stagebadge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}

/* captain slots */
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;min-height:60px}
.slot:last-child{border-bottom:0}
.teamtag{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:32px;padding:0 10px;border-radius:8px;font-family:var(--latin);letter-spacing:.5px;font-size:16px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.slot .who{flex:1;font-weight:500}
.slot .who.empty{color:var(--muted);font-weight:400}
.ordr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ordr:last-child{border-bottom:0}
.ordr .n{font-family:var(--display);font-size:20px;width:28px}
.ordr .who{flex:1}
.ordr button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font-size:16px}

/* draft */
.turn{border-radius:16px;padding:16px;color:#fff;background:var(--board);position:relative;overflow:hidden}
.turn .k{font-size:13px;opacity:.8}
.turn .t{font-family:var(--display);font-size:26px;line-height:1.2;margin-top:2px}
.turn .nx{display:flex;gap:6px;margin-top:12px;align-items:center;font-size:12px;opacity:.9;flex-wrap:wrap}
.turn .nx span{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;font-family:var(--latin);font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.turn.mine{box-shadow:0 0 0 3px var(--amber)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);min-width:0}
.col .hd{padding:8px 10px;font-family:var(--latin);font-size:16px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.col .hd small{font-family:var(--body);font-size:12px;opacity:.85}
.col ol{list-style:none;margin:0;padding:6px 8px 8px}
.col li{padding:5px 2px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:4px;align-items:center;min-width:0}
.col li:last-child{border-bottom:0}
.col li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col li em{font-style:normal;font-size:11px;color:var(--muted);width:18px;flex:none}
.col li.swap{background:var(--accent);color:var(--accent-ink);border-radius:6px}
.col li button{width:100%;text-align:left;display:flex;gap:4px;align-items:center;min-height:32px}

/* chat */
.chat{display:flex;flex-direction:column;height:min(46vh,380px)}
.chat .msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;align-self:flex-start}
.msg .n{font-size:11px;color:var(--muted);margin:0 0 2px 4px}
.msg .b{background:var(--bg);padding:8px 12px;border-radius:14px 14px 14px 4px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end}
.msg.me .n{text-align:right;margin:0 4px 2px 0}
.msg.me .b{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .b{background:none;color:var(--muted);font-size:12px;padding:2px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat form .inp{flex:1;min-width:0}

/* poster */
.poster{display:block;width:100%;height:auto;border-radius:12px;background:#0B1E5B}

/* match */
.live{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--board);color:#fff;text-align:left;width:100%}
.live .ph{font-size:12px;color:var(--amber)}
.live .tm{font-family:var(--display);font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.live .sc{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.live .sc b{font-family:var(--display);font-weight:400;font-size:22px}
.live .sc span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 5px;text-align:center;white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.pts{font-weight:700}
.rank{font-family:var(--display);font-size:18px;width:32px}
.teamcell{display:flex;align-items:center;gap:7px;font-weight:500}
.final{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-family:var(--body)}
.round h3{font-size:13px;font-weight:500;color:var(--muted);margin:14px 2px 6px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;padding:12px;border-bottom:1px solid var(--line);text-align:left;min-height:60px}
.mrow:last-child{border-bottom:0}
.mrow .side{display:flex;align-items:center;gap:7px;min-width:0}
.mrow .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .side.r{justify-content:flex-end}
.mrow .mid{text-align:center;min-width:82px}
.mrow .sc{font-family:var(--display);font-size:22px;line-height:1}
.mrow .st{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.mrow.is-live .st{color:var(--live);font-weight:700}
.mrow.win-h .side:first-child span,.mrow.win-a .side.r span{font-weight:700}
.list2 div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.list2 div:last-child{border-bottom:0}
.momrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;min-height:54px}
.momrow:last-child{border-bottom:0}
.momrow .t{flex:1;font-weight:500}
.momrow .v{color:var(--muted)}
.momrow .v.set{color:var(--ink);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:44px;height:44px;font-size:20px;flex:none}
.stepper span{text-align:center;font-weight:700;font-size:14px}
.stepper span small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.1}

.overlay{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .wrap{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.obar{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px}
.board{background:var(--board);color:#fff;border-radius:18px;padding:16px 12px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
.board .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;position:relative}
.board .t{text-align:center;min-width:0}
.board .t .bar{height:6px;border-radius:3px;margin:0 auto 6px;width:56px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.board .t .nm{font-family:var(--latin);font-size:18px;letter-spacing:.5px}
.board .num{font-family:var(--display);font-size:clamp(68px,24vw,108px);line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(255,210,31,.35);font-variant-numeric:tabular-nums}
.board .colon{font-family:var(--display);font-size:40px;color:rgba(255,255,255,.35)}
.board .phase{position:relative;text-align:center;margin-top:10px;font-weight:700;font-size:15px;color:var(--amber)}
.board .clock{position:relative;text-align:center;font-family:var(--display);font-size:54px;line-height:1.1;letter-spacing:2px;font-variant-numeric:tabular-nums}
.board .clock.over{color:var(--over)}
.board .clock.gk{color:var(--amber)}
.prog{position:relative;display:grid;gap:3px;margin-top:10px}
.prog .seg{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.prog .seg i{display:block;height:100%;background:var(--amber);width:0}
.goalbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.goalbtn{min-height:84px;border-radius:16px;font-weight:700;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.goalbtn small{font-family:var(--latin);font-weight:400;font-size:15px;letter-spacing:.5px}
.ctrl{margin-top:10px}
.ctrl .btn{min-height:54px;font-size:16px}
.ev{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .min{font-family:var(--display);width:40px;color:var(--muted);font-size:15px}
.ev .who{flex:1;min-width:0}
.ev .who small{color:var(--muted);margin-left:4px}
.ev .x{width:40px;height:40px;border-radius:10px;color:var(--muted);font-size:20px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick button{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:16px;padding:0 10px}
.pick button.alt{color:var(--muted);font-weight:400;font-size:14px}
.pick button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* stats */
.sorts{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.sorts button{min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;flex:none}
.sorts button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats td:first-child,.stats th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.stats td.hl{font-weight:700;color:var(--accent)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{min-height:58px;font-weight:500;color:var(--muted);position:relative}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* op mode + captain */
.opbtn{flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:13px;font-weight:700}
.opbtn.on{background:var(--amber);border-color:var(--amber);color:#1A1400}
.capbanner{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.capbanner b{font-weight:700}
.mystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mystats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.mystats b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.mystats span{font-size:12px;color:var(--muted)}
.stats tr.me td{background:rgba(30,70,200,.08)}
.stats tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* member home */
.gear{width:36px;height:36px;border-radius:99px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:17px;flex:none}
.backlink{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;color:var(--accent);font-weight:700;font-size:15px}
.hero{margin-top:14px;border-radius:20px;padding:18px 18px 16px;color:#fff;background:
  linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.12) calc(50% - 1px),rgba(255,255,255,.12) calc(50% + 1px),transparent calc(50% + 1px)),
  radial-gradient(circle at 50% 50%,transparent 62px,rgba(255,255,255,.12) 63px,rgba(255,255,255,.12) 65px,transparent 66px),
  linear-gradient(160deg,#0B1E5B 0%,#15378F 100%);position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-k{font-family:var(--latin);letter-spacing:2px;font-size:14px;opacity:.8}
.dday{font-family:var(--latin);font-size:16px;letter-spacing:1px;background:var(--amber);color:#1A1400;padding:3px 10px;border-radius:8px}
.dday.sm{font-size:13px;padding:2px 8px}
.hero-date{font-family:var(--latin);font-size:64px;line-height:1;margin-top:10px;letter-spacing:1px}
.hero-date small{font-family:var(--display);font-size:22px;margin-left:10px;color:var(--amber);letter-spacing:0}
.hero-time{font-family:var(--latin);font-size:30px;line-height:1.1;opacity:.95}
.hero-venue{margin-top:6px;font-size:16px;font-weight:500}
.hero-empty{font-family:var(--display);font-size:24px;margin:14px 0 4px}
.hero p{margin:0;opacity:.8;font-size:14px}
.hero-status{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(127,127,127,.2)}
.st-open{background:#1FB45A;color:#fff}.st-soon{background:#E6EEFF;color:#1E46C8}.st-closed{background:#6B7280;color:#fff}.st-draft{background:var(--amber);color:#1A1400}.st-teams{background:#7C4DD6;color:#fff}.st-live{background:var(--live);color:#fff}.st-done{background:#9AA3AF;color:#fff}
.cap{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.cap-row{display:flex;justify-content:space-between;align-items:baseline}
.cap-row span{font-size:13px;opacity:.85}
.cap-row b{font-family:var(--latin);font-weight:400;font-size:30px}
.cap-row b small{font-family:var(--body);font-size:14px;opacity:.8}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}

.act{margin-top:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.act>b{font-size:16px;display:flex;align-items:center;gap:8px}
.act p{margin:-6px 0 0;color:var(--muted);font-size:14px}
.act.live{border-color:var(--live)}
.act .lv{display:flex;align-items:center;gap:6px;font-size:15px}
.act .lv b{font-family:var(--display);font-weight:400;font-size:20px;margin:0 4px}
.act .lv span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--live);font-weight:700}
.caps{display:grid;gap:6px}
.caps{grid-template-columns:auto 1fr;align-items:center}
.rosters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rosters>div{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.rosters .rh{font-family:var(--latin);font-size:15px;letter-spacing:.5px;padding:6px 8px}
.rosters ul{list-style:none;margin:0;padding:4px 8px 6px;font-size:14px;line-height:1.75}
.rosters li.me{font-weight:700;color:var(--accent)}
.resmini{display:grid;gap:2px;width:100%;padding:8px 14px;text-align:left}
.resmini .rm{display:flex;align-items:center;gap:8px;padding:6px 0}
.resmini .rm em{font-style:normal;font-family:var(--display);width:30px}
.resmini .rm small{margin-left:auto;color:var(--muted)}
.resmini .rm.mine b{color:var(--accent)}
.resmini .more{font-size:13px;color:var(--accent);padding:6px 0 2px;border-top:1px solid var(--line);margin-top:4px}
button.mystats{width:100%;padding:0;border:0;background:none}

/* home sections */
.sec-lab{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-lab span{font-family:var(--latin);font-size:22px;letter-spacing:1px}
.sec-lab small{font-size:13px;color:var(--muted)}
.review{display:block;width:100%;text-align:left;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding:0}
.review.empty-r{padding:22px;text-align:center;color:var(--muted)}
.rv-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--tc);color:var(--ti)}
.rv-trophy{font-size:28px}
.rv-top small{display:block;font-size:12px;opacity:.8}
.rv-top b{display:block;font-family:var(--latin);font-weight:400;font-size:28px;letter-spacing:1px;line-height:1.1}
.rv-pts{margin-left:auto;font-family:var(--latin);font-size:28px;white-space:nowrap}
.rv-pts small{font-family:var(--body);font-size:13px;margin-left:2px}
.rv-rows{padding:2px 16px}
.rv-rows .rc-row:first-child{border-top:0}
.rv-rows .rc-row.mine{margin:0 -16px;padding:7px 16px}
.rv-meta{display:grid;gap:4px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.rv-meta em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);display:inline-block;width:46px}
.review .more{display:block;padding:12px 16px;border-top:1px solid var(--line);color:var(--accent);font-size:14px;font-weight:700}
.hero{margin-top:0}
.linkbtn{justify-self:start;color:var(--accent);font-size:14px;font-weight:700;min-height:32px}
/* team colors */
.colrow{padding:12px 14px;border-bottom:1px solid var(--line)}
.colrow:last-child{border-bottom:0}
.colhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colhd em{font-style:normal;font-size:12px;color:var(--live);font-weight:700}
.cswatch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.csw{min-height:48px;border-radius:10px;font-family:var(--latin);font-size:16px;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.csw small{font-family:var(--body);font-size:10px;opacity:.8}
.csw.on{outline:3px solid var(--accent);outline-offset:2px}
.csw:disabled{opacity:.35}
/* admin manage */
.mg-top{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.mg-top .btn{white-space:nowrap}
.sheetwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;min-width:980px;font-size:14px}
table.grid th{position:sticky;top:0;background:var(--surface);text-align:left;padding:10px 8px;white-space:nowrap}
table.grid td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
table.grid tr:hover td{background:rgba(30,70,200,.04)}
table.grid .stick{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
table.grid td.num{text-align:center;font-variant-numeric:tabular-nums}
table.grid td.acts{display:flex;gap:4px}
table.grid td.acts .btn{min-height:34px;padding:0 10px;font-size:13px}
.cell{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;min-height:38px;width:100%}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--bg);outline:none}
.cell.w-venue{min-width:130px}.cell.w-num{width:64px}.cell.w-dt{min-width:190px}
.cellbtn{min-height:38px;padding:0 6px;border-radius:8px;text-align:left}
.cellbtn:hover:not(:disabled){background:var(--bg)}
.cellbtn:disabled{opacity:1;cursor:default}
.dw{font-size:12px;color:var(--muted)}.dw.sun,.cw.sun,.cd.sun{color:#D7263D}.dw.sat,.cw.sat,.cd.sat{color:#1E46C8}
/* members */
.mtools{display:grid;gap:10px;margin:12px 0}
.mtools .seg{margin:0}
.msort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.msort select{width:auto;min-height:38px;padding:6px 10px}
select.cell{appearance:auto}
.cell.w-name{min-width:96px;font-weight:700}.cell.w-st{width:96px}.cell.w-tel{min-width:150px}.cell.w-memo{min-width:180px}
.cell.st-guest{color:#B7791F}.cell.st-dormant{color:var(--muted)}
.telcell{display:flex;align-items:center;gap:2px}
.tel{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;text-decoration:none}
.tel:hover{background:var(--bg)}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){.mtools{grid-template-columns:minmax(220px,340px) auto auto;align-items:center;justify-content:start}}
/* apply */
.applied{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(31,180,90,.12);border:1px solid rgba(31,180,90,.4)}
.applied span{font-weight:700;color:#138A45;display:grid}
.applied small{font-weight:400;font-size:12px;color:var(--muted)}
.applied.wait{background:rgba(255,210,31,.14);border-color:rgba(200,160,0,.45)}
.applied.wait span{color:#8A6A00}
.applybtn{min-height:54px;font-size:17px}
h2 .st{font-family:var(--body)}
/* draft room */
.chathd{justify-content:space-between;align-items:center}
.namegrid{display:flex;flex-wrap:wrap;gap:8px}
.nb{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.nb:not(:disabled):hover{transform:translateY(-1px);border-color:var(--accent)}
.nb:disabled{opacity:.45;cursor:not-allowed}
.nb.taken{opacity:1;border-color:transparent;cursor:default}
.nb.taken small{font-size:10px;opacity:.8}
.nb.pend{opacity:1;border:3px solid var(--tc);box-shadow:0 0 0 4px rgba(255,210,31,.35);font-weight:700;animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 8px rgba(255,210,31,.1)}}
.board-table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"host host host" "felt felt felt" "l b r";gap:8px;align-items:start}
.board-table .seat{min-width:0}
.board-table .pos-l .bubble,.board-table .pos-r .bubble{left:50%;right:auto;transform:translateX(-50%)}
.board-table .host{grid-area:host}.pos-l{grid-area:l}.pos-r{grid-area:r}.pos-b{grid-area:b}.board-table .felt{grid-area:felt}
.pos-l,.pos-r{align-self:start}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){.pos-l,.pos-r{align-self:center}}
.seat{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 8px 8px;text-align:center;overflow:hidden}
.seat::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--tc,#9AA3AF)}
.seat.host{padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;justify-self:center;min-width:180px}
.seat.host::before{background:var(--amber)}
.seat.host .sv{margin:0}.seat.host .sn{margin:0}.seat.host.off{opacity:.6}
.seat.onturn{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,210,31,.45)}
.seat.me{border-color:var(--accent)}
.sv{position:relative;display:inline-block;margin-bottom:4px}
.av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--bg);font-weight:700;font-size:14px;position:relative;border:2px solid var(--tc,#9AA3AF)}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#1FB45A;border:2px solid var(--surface)}
.ord{position:absolute;top:-6px;left:-10px;font-style:normal;font-family:var(--display);font-size:13px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#1A1400;display:flex;align-items:center;justify-content:center}
.sn{font-weight:700;font-size:13px;line-height:1.3;word-break:keep-all}
.st2{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.st2 small{font-size:11px;color:var(--muted)}
.tok{display:inline-block;font-family:var(--latin);font-size:12px;letter-spacing:.5px;padding:1px 7px;border-radius:6px;background:var(--tc);color:var(--ti);box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.hand{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:1px dashed var(--line);font-size:12px;line-height:1.7}
.pos-b .hand{display:flex;flex-wrap:wrap;justify-content:center;gap:0 8px}
.seat .btn{margin-top:8px;width:100%}
.felt{min-height:250px;border-radius:26px;border:8px solid #6B3F1D;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.2);background:radial-gradient(circle at 50% 45%,#2E8B4A 0%,#1E6B37 60%,#154F29 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:12px 10px;text-align:center}
.fx{display:grid;gap:8px;justify-items:center;width:100%}
.fx b{font-size:15px;line-height:1.35}
.fx p{margin:0;font-size:12px;opacity:.85}
.fx .big{font-family:var(--latin);font-size:46px;line-height:1}
.fx .rnd{font-family:var(--latin);font-size:14px;letter-spacing:1px;color:var(--amber)}
.fx .btn{min-height:42px}
.felt .btn:not(.primary){color:#131C2B;background:#fff}
.felt .btn.sm{min-height:34px;padding:0 12px}
.cswatch.sm{grid-template-columns:repeat(3,1fr);width:100%;margin:0}
.cswatch.sm .csw{min-height:40px;font-size:13px}
.card3{width:84px;height:112px;border-radius:10px;background:repeating-linear-gradient(45deg,#fff 0 6px,#f0f0f0 6px 12px);color:#1A1F27;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;box-shadow:0 6px 14px rgba(0,0,0,.35);border:3px solid #fff}
.card3.up{background:#fff;font-size:17px;padding:6px;border-color:var(--tc);animation:flip .4s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.ladder{width:100%;max-width:340px;height:auto}
.ladder .lg{stroke:rgba(255,255,255,.55);stroke-width:3;stroke-linecap:round}
.ladder .lp{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ladder text{fill:#fff;font-size:13px;text-anchor:middle;font-family:var(--body);font-weight:700}
.ladder .lb{fill:var(--amber);font-family:var(--display);font-size:15px}
@keyframes ladder{to{stroke-dashoffset:0}}
.ladder .lp.under{stroke:rgba(0,0,0,.35);stroke-width:9}
.ladder .lt{font-family:var(--latin);font-size:13px;letter-spacing:.5px}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
  .board-table{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,220px);grid-template-areas:". host ." "l felt r" ". b .";max-width:1000px;margin:0 auto;gap:14px}
  .board-table .pos-l .bubble{left:0;transform:none}.board-table .pos-r .bubble{left:auto;right:0;transform:none}
  .felt{min-height:340px}
  .sn{font-size:15px}.av{width:54px;height:54px;font-size:16px}.hand{font-size:14px}
  .namegrid .nb{min-height:44px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){.nb.pend,.card3.up{animation:none}.ladder .lp{animation:none!important;stroke-dashoffset:0!important}}
/* chat bar + bubbles */
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.08)}
.chatbar .inp{flex:1;min-width:0}
.chatbar-space{height:76px}
.seat{overflow:visible}
.seat::before{border-radius:12px 12px 0 0}
.bubble{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);z-index:4;max-width:170px;min-width:60px;width:max-content;background:#fff;color:#131C2B;border:2px solid var(--tc,#FFD21F);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:500;line-height:1.35;box-shadow:0 6px 14px rgba(0,0,0,.2);animation:pop .25s ease;word-break:break-word;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--tc,#FFD21F)}
.seat.host .bubble{--tc:#FFD21F}
.pos-l .bubble{left:0;transform:none}.pos-l .bubble::after{left:24px}
.pos-r .bubble{left:auto;right:0;transform:none}.pos-r .bubble::after{left:auto;right:18px;transform:none}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.pos-l .bubble,.pos-r .bubble{animation:pop2 .25s ease}
@keyframes pop2{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.board-table{padding-top:30px}
.dmroot .board-table{padding-top:0}
.board-table .host{margin-bottom:4px}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){.chatbar{left:210px;bottom:0;padding:12px 36px}.bubble{max-width:220px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
.chatrow{margin-top:16px}
.chatrow .btn{position:relative}
.unread{position:absolute;top:-6px;right:-6px;font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--live);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.logsheet{height:min(62vh,560px)}
.msg .n time{margin-left:6px;font-size:10px;opacity:.7}
/* no zoom / no sideways scroll */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
@media not all and (min-width:1024px) and (hover:hover) and (pointer:fine){.inp,input,select,textarea{font-size:16px}}

/* schedule */
