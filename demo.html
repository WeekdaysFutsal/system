<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B3772">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FMFC · Football Matching FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#1E3C7B; --navy-d:#142A57; --navy-dd:#0E1E40;
  --red:#A3262E; --red-d:#7E1B22;
  --orange:#EC7B2C; --orange-d:#C9631C;
  --cream:#F3EDDC; --cream-2:#E7DEC4; --cream-3:#D8CCA8;
  --paper:#F7F2E6; --card:#FFFCF4; --line:#E3D8BC;
  --ink:#16223F; --ink-2:#4A5574; --ink-3:#8A90A3;
  --ok:#2F7D4F;
  --r:16px;
  --stripes:repeating-linear-gradient(90deg,
    var(--red) 0 34px, var(--cream) 34px 37px, var(--navy) 37px 42px, var(--cream) 42px 45px,
    var(--orange) 45px 79px, var(--cream) 79px 82px, var(--navy) 82px 87px, var(--cream) 87px 90px);
  --shadow:0 1px 0 rgba(20,42,87,.04), 0 6px 18px -10px rgba(20,42,87,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{touch-action:manipulation;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{background:#E9E2CF;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 40px rgba(20,42,87,.12)}
.stripes{background:var(--stripes)}
.wm{font-family:"Pirata One",serif;letter-spacing:.02em;line-height:1;color:var(--cream);text-shadow:2px 2px 0 var(--red),3.5px 3.5px 0 var(--navy-dd)}
.wm.sm{font-size:22px}
.muted{color:var(--ink-3)}
.serif{font-family:"Cormorant Garamond",serif}

/* top */
header.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--navy);padding-top:env(safe-area-inset-top)}
header.top .wm{font-size:32px;cursor:pointer}
.top-r{display:flex;align-items:center;gap:10px}
.demo{font:700 11px/1 "Barlow Condensed";letter-spacing:.12em;color:var(--navy-d);background:var(--orange);padding:5px 7px 4px;border-radius:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--cream);color:var(--navy);font-weight:800;font-size:13px;border:2px solid var(--orange);display:grid;place-items:center}
.band{height:9px;position:sticky;top:58px;z-index:29;box-shadow:0 2px 6px rgba(0,0,0,.12)}
main{padding:18px 16px 110px}
section{margin-top:26px}
section:first-child{margin-top:0}

/* nav */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy-d);padding-bottom:env(safe-area-inset-bottom);border-top:3px solid var(--orange)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:#9FB0D6;font-size:11.5px;font-weight:600;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--cream)}
nav.tabs button.on::before{content:"";position:absolute;top:-3px;left:30%;right:30%;height:3px;background:var(--cream)}

/* titles */
.sec{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec em{font:italic 700 14px "Cormorant Garamond",serif;color:var(--red);letter-spacing:.06em}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-row .sec{margin:0}
.bar{display:flex;align-items:center;gap:10px;margin:-2px 0 16px;min-height:38px}
.bar h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;min-width:0}
.bar h2 small{font-size:13px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--navy)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .08s, filter .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);color:var(--cream);box-shadow:inset 0 -3px 0 var(--red-d)}
.btn.navy{background:var(--navy);color:var(--cream);box-shadow:inset 0 -3px 0 var(--navy-dd)}
.btn.orange{background:var(--orange);color:var(--navy-dd);box-shadow:inset 0 -3px 0 var(--orange-d)}
.btn.ghost{background:transparent;border:1.5px solid var(--cream-3);color:var(--navy)}
.btn.danger{background:transparent;border:1.5px solid #E2B4B6;color:var(--red)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.link{color:var(--orange);font-weight:700;font-size:14px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row-btns .btn{flex:1}

/* pills */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.cream{background:var(--cream);color:var(--navy-d)}
.pill.line{border:1px solid rgba(243,237,220,.55);color:var(--cream)}
.pill.open{background:var(--orange);color:var(--navy-dd)}
.pill.closed{background:var(--cream-2);color:var(--navy-d)}
.pill.done{background:var(--navy-d);color:var(--cream);border:1px solid rgba(243,237,220,.4)}
.pill.canceled{background:#5a5a5a;color:#eee}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;font:700 12px/1 "Barlow Condensed";letter-spacing:.04em}
.tag.GK{background:#F6D9B9;color:#8A4310}.tag.DF{background:#D6DEF0;color:var(--navy)}.tag.MF{background:#E9E1C6;color:#5B4D1E}.tag.FW{background:#F2D0D2;color:var(--red-d)}
.tag.sub{opacity:.6}
.role{font-size:11px;font-weight:800;color:var(--cream);background:var(--red);padding:2px 6px;border-radius:5px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);background:var(--card);border:1px dashed var(--cream-3);border-radius:var(--r);font-size:14px}

/* hero */
.hero,.mcard{border-radius:20px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(20,42,87,.7);background:var(--navy-d)}
.hero-top,.mcard-top{position:relative;padding:18px 18px 20px;min-height:168px;display:flex;align-items:flex-end}
.mcard-top{min-height:128px;padding:16px 18px}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,30,64,.30) 0%,rgba(14,30,64,.72) 55%,rgba(14,30,64,.96) 100%)}
.hero-shade::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--navy) 0 30%,var(--cream) 30% 31.5%,transparent 31.5% 68.5%,var(--cream) 68.5% 70%,var(--navy) 70%)}
.hero-in{position:relative;z-index:1;width:100%;color:var(--cream)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hero-vs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-vs .vs{font:800 15px "Barlow Condensed";color:var(--orange);letter-spacing:.1em}
.hero-vs .opp{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero-when{margin-top:10px;font:700 21px "Barlow Condensed";letter-spacing:.03em}
.hero-where{font-size:14px;opacity:.9;display:flex;gap:5px;align-items:center}
.hero-body{padding:16px 18px 16px;color:var(--cream)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.hero-foot .muted{color:#9FB0D6}
.score{margin-top:12px;font:800 44px/1 "Barlow Condensed";letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.wdl{font:800 14px/1 "Barlow Condensed";padding:6px 9px 5px;border-radius:6px;letter-spacing:.1em}
.wdl.w{background:var(--orange);color:var(--navy-dd)}.wdl.d{background:var(--cream-2);color:var(--navy-d)}.wdl.l{background:var(--red);color:var(--cream)}

/* attendance bar */
.att{margin-bottom:14px}
.att.light .att-bar{background:var(--cream-2)}
.att.light .att-bar .n{background:#9AA3BC}
.att.light .att-txt{color:var(--ink-2)}
.att.light .att-txt b{color:var(--navy)}
.resp-mini{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1.5px solid rgba(243,237,220,.3);background:rgba(255,255,255,.07);color:var(--cream);font-weight:800;font-size:14px}
.resp-mini .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.resp-mini .ic svg{width:14px;height:14px}
.resp-mini.st-yes{border-color:var(--orange)}
.resp-mini.st-yes .ic{background:var(--orange);color:var(--navy-dd)}
.resp-mini.st-maybe .ic{background:var(--cream);color:var(--navy-d)}
.resp-mini.st-no .ic{background:#56607D;color:#fff}
.resp-mini .go{font-size:12px;color:var(--orange);margin-left:2px}
.resp-mini:disabled{opacity:1;cursor:default}
.note-s{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--cream-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-prev{display:flex;gap:14px;align-items:center;cursor:pointer}
.lu-prev .pitch-wrap{width:50%;max-width:210px;flex:none;margin:0}
.lu-prev-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:13.5px;color:var(--ink-2)}
.lu-prev-t b{font:800 20px/1 "Barlow Condensed";color:var(--navy);letter-spacing:.04em}
.lu-prev-t small{color:var(--ink-3);font-size:12px;margin-top:4px;line-height:1.45}
.att-bar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.12)}
.att-bar i{display:block;height:100%}
.att-bar .y{background:var(--orange)}.att-bar .m{background:var(--cream-3)}.att-bar .n{background:#6C7899}
.att-txt{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:#C9D3EA;flex-wrap:wrap}
.att-txt b{color:var(--cream);font:700 16px "Barlow Condensed";margin-left:2px}
.warn{color:var(--orange);font-weight:700}

/* choice */
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{height:50px;border-radius:12px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.08);color:var(--cream);border:1.5px solid rgba(243,237,220,.25)}
.ch.on.ch-yes{background:var(--orange);color:var(--navy-dd);border-color:var(--orange)}
.ch.on.ch-maybe{background:var(--cream);color:var(--navy-d);border-color:var(--cream)}
.ch.on.ch-no{background:#56607D;color:#fff;border-color:#56607D}
.light .ch{background:var(--card);color:var(--navy);border-color:var(--line)}

/* match rows */
.mrow{display:flex;align-items:stretch;gap:0;margin-bottom:10px;overflow:hidden;cursor:pointer}
.mrow .d{width:64px;flex:none;background:var(--navy);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:10px 0}
.mrow .d::after{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:linear-gradient(90deg,var(--red) 0 50%,var(--orange) 50%)}
.mrow .d b{font:800 22px/1 "Barlow Condensed"}
.mrow .d small{font-size:11px;opacity:.85;margin-top:3px}
.mrow .c{flex:1;min-width:0;padding:11px 12px}
.mrow .c .o{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .c .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .c .t{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.mrow .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:10px 12px;gap:4px;text-align:right}
.mrow .r .sc{font:800 24px/1 "Barlow Condensed";color:var(--navy)}
.mini-tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--cream-2);color:var(--navy-d)}
.mini-tag.yes{background:var(--orange);color:var(--navy-dd)}.mini-tag.no{background:#DADDE6;color:#4A5574}.mini-tag.maybe{background:var(--cream-2)}
.mini-tag.st-open{background:#FBE3CF;color:#9A4A12}.mini-tag.st-closed{background:#E4E7EF;color:var(--navy)}.mini-tag.st-canceled{background:#e8e8e8;color:#666}
.mini-tag.nr{background:#F7DADB;color:var(--red-d)}

/* season strip */
.season{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.season div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.season b{display:block;font:800 26px/1.05 "Barlow Condensed";color:var(--navy)}
.season span{font-size:12px;color:var(--ink-2);font-weight:600}
.season .w b{color:var(--orange-d)}.season .l b{color:var(--red)}
.form{display:flex;gap:5px;align-items:center;margin-bottom:12px;font-size:12px;color:var(--ink-3);font-weight:600}
.form i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 "Barlow Condensed";font-style:normal}
.form i.w{background:var(--orange);color:var(--navy-dd)}.form i.d{background:var(--cream-2);color:var(--navy-d)}.form i.l{background:var(--red);color:var(--cream)}

/* notices */
.notice{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.notice .pin{color:var(--red);margin-top:1px}
.notice .tt{font-weight:700;flex:1;min-width:0}
.notice .tt small{display:block;font-weight:500;color:var(--ink-3);font-size:12px;margin-top:2px}
.notice .ex{font-weight:400;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* detail */
.info{margin:0;padding:6px 18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;color:var(--cream)}
.info div{min-width:0}
.info .full{grid-column:1/-1}
.info dt{font-size:11.5px;color:#9FB0D6;font-weight:600;margin-bottom:1px}
.info dd{margin:0;font-weight:600;font-size:14px}
.uni-ic{display:inline-flex;align-items:center;gap:7px}
.uni-ic .shirt-svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.my-in{border-top:1px solid rgba(243,237,220,.14)}
.resp-btn{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid rgba(243,237,220,.25);color:var(--cream)}
.resp-btn .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.resp-btn.st-yes{border-color:var(--orange)}
.resp-btn.st-yes .ic{background:var(--orange);color:var(--navy-dd)}
.resp-btn.st-maybe .ic{background:var(--cream);color:var(--navy-d)}
.resp-btn.st-no .ic{background:#56607D;color:#fff}
.resp-btn .tx{flex:1;min-width:0}
.resp-btn .tx b{display:block;font-size:15.5px;font-weight:800}
.resp-btn .tx small{display:block;color:#C9D3EA;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resp-btn .go{font-size:13px;font-weight:800;color:var(--orange);flex:none}
.resp-btn:disabled{opacity:1;cursor:default}
.resp-btn:disabled .go{color:#9FB0D6}
#ptr{position:fixed;left:50%;top:58px;z-index:28;transform:translate(-50%,-56px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s}
#ptr .ptr-c{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:grid;place-items:center;border:2px solid var(--orange);box-shadow:0 6px 16px rgba(14,30,64,.3)}
#ptr .ptr-c svg{width:20px;height:20px}
#ptr.ready .ptr-c{background:var(--orange);color:var(--navy-dd)}
#ptr.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.my-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:10px}
.pitch.anim .tok{transition:left .6s cubic-bezier(.45,0,.2,1),top .6s cubic-bezier(.45,0,.2,1)}
.pitch.anim svg.mv,.pitch.anim .ghost{animation:fadein .35s .5s both}
.pitch.anim .ptag{animation:fadein .3s both}
@keyframes fadein{from{opacity:0}}
.block{padding:16px;margin-top:14px}
.block h4{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;justify-content:space-between}
.block h4 .n{font:800 18px "Barlow Condensed";color:var(--red);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;max-width:100%}
.chip .no{font:700 13px "Barlow Condensed";color:var(--red)}
.chip.me{border-color:var(--orange);box-shadow:0 0 0 1.5px var(--orange) inset}
.chip.guest{background:var(--cream)}
.chip.wait{opacity:.6;border-style:dashed}
.chip .note{font-weight:400;color:var(--ink-3);font-size:12px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[data-act]{cursor:pointer}
.grp{margin-bottom:14px}
.grp:last-child{margin-bottom:0}
.grp-t{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.my-resp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.my-resp .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.my-resp .note{margin-top:10px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:center}

/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:68/96;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(180deg,#1E3C7B 0 10%,#22448A 10% 20%);border:3px solid var(--navy-dd);box-shadow:inset 0 0 0 6px #1E3C7B}
.pitch .pl{position:absolute;border:2px solid rgba(243,237,220,.55)}
.pitch .half{left:4%;right:4%;top:50%;height:0;border-width:2px 0 0}
.pitch .circle{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box-t{left:22%;right:22%;top:3%;height:15%;border-top:0}
.pitch .box-b{left:22%;right:22%;bottom:3%;height:15%;border-bottom:0}
.pitch .six-t{left:36%;right:36%;top:3%;height:6%;border-top:0}
.pitch .six-b{left:36%;right:36%;bottom:3%;height:6%;border-bottom:0}
.pitch .frame{inset:3% 4%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:76px;z-index:2}
.tok .disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--cream);border:2.5px solid var(--cream);font:800 18px/1 "Barlow Condensed";box-shadow:0 4px 10px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tok .disc::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 38%,var(--orange) 38% 62%,transparent 62%);opacity:.9}

    render();

      try { await this.db.collection(col).doc(copy.id).set(copy); }

/* ===== 기록 ===== */
function viewRecords() {
  const yr = S.recYear; const sd = seasonData(yr); const t = sd.team;
  const rows = Object.values(sd.per).map(r => ({ ...r }));
  const memByName = {}; Store.list('members').forEach(x => memByName[x.name] = x);
  activeMembers().forEach(p => { if (!sd.per[p.name]) rows.push({ name: p.name, number: p.number, att: 0, g: 0, a: 0, mvp: 0, q: 0 }); });
  rows.forEach(r => { const mm = memByName[r.name]; if (mm && mm.number != null && mm.number !== '') r.number = mm.number; r.isMe = !!mm && mm.id === me().id; r.former = !mm; });
  const rate = r => t.p ? Math.round(r.att / t.p * 100) : 0;
  const key = S.recSort;
  const val = (r, k) => k === 'rate' ? rate(r) : k === 'ap' ? r.g + r.a : r[k];
  rows.sort((a, b) => val(b, key) - val(a, key) || b.g - a.g || byName(a, b));
  const top = (k, unit) => { const arr = [...rows].filter(r => val(r, k) > 0).sort((a, b) => val(b, k) - val(a, k) || byName(a, b)).slice(0, 3); return arr.length ? `<ol>${arr.map(r => `<li><span>${esc(r.name)}</span><b>${val(r, k)}${unit}</b></li>`).join('')}</ol>` : '<div class="muted" style="font-size:13px">기록 없음</div>'; };
  const th = (k, label) => `<th class="sort ${key === k ? 'on' : ''}" data-act="recSort" data-k="${k}">${label}${key === k ? ' ▾' : ''}</th>`;
  return `<div class="bar"><h2>기록</h2><select class="btn sm ghost" data-chg="recYear" aria-label="시즌">${seasonYears().map(y => `<option ${y === yr ? 'selected' : ''} value="${y}">${y} 시즌</option>`).join('')}</select></div>
    ${sheetBadge()}
    ${seasonStrip(sd)}
    <div class="season" style="grid-template-columns:repeat(3,1fr)"><div><b>${t.gf}</b><span>득점</span></div><div><b>${t.ga}</b><span>실점</span></div><div><b>${t.p ? Math.round(t.w / t.p * 100) : 0}<small style="font-size:15px">%</small></b><span>승률</span></div></div>
    <section><h3 class="sec"><em>Leaders</em>부문별 순위</h3>
      <div class="leaders"><div class="leader card"><h5>득점왕<em>Goals</em></h5>${top('g', '')}</div><div class="leader card"><h5>도움왕<em>Assists</em></h5>${top('a', '')}</div>
      <div class="leader card"><h5>출석왕<em>Attendance</em></h5>${top('att', '경기')}</div><div class="leader card"><h5>MVP<em>Man of the Match</em></h5>${top('mvp', '회')}</div></div></section>
    <section><h3 class="sec"><em>Players</em>개인 기록</h3>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>선수</th>${th('att', '출전')}${th('rate', '출석률')}${th('q', '쿼터')}${th('g', '골')}${th('a', '도움')}${th('ap', '공격P')}${th('mvp', 'MVP')}</tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.isMe ? 'me' : ''}"><td>${r.number != null && r.number !== '' ? `<span class="no">${esc(r.number)}</span>` : ''}${esc(r.name)}${r.former ? ' <small class="muted">OB</small>' : ''}</td><td class="num">${r.att}</td><td class="num">${rate(r)}%</td><td class="num">${r.q}</td><td class="num">${r.g}</td><td class="num">${r.a}</td><td class="num">${r.g + r.a}</td><td class="num">${r.mvp}</td></tr>`).join('')}</tbody></table></div>
      <p class="help">구글 시트 '개인기록' 탭 기준 · 출전 = 기록된 경기 수 · 출석률 = 출전 ÷ 시즌 경기 수 · 이름 기준으로 집계</p></section>
    <section><h3 class="sec"><em>Results</em>경기 결과</h3>${[...sd.done].reverse().map(resultRow).join('') || '<div class="empty">이 시즌의 경기 기록이 없습니다</div>'}</section>`;
}

function memberListHtml(base) {
  const f = S.memFilter, q = S.memQ.trim();
  let list = base.filter(m => {
    if (f === 'admin' && m.role !== 'admin') return false;
    if (f === 'rest' && m.status !== 'rest') return false;
    if (POS_LIST.includes(f) && !(m.pos || []).includes(f)) return false;
    if (q && !(m.name.includes(q) || String(m.number ?? '') === q)) return false;
    return true;
  });
  list.sort((a, b) => (a.status === 'rest') - (b.status === 'rest') || (b.role === 'admin') - (a.role === 'admin') || (+a.number || 999) - (+b.number || 999) || byName(a, b));
  return list.map(m => memberItem(m)).join('') || '<div class="empty">해당하는 회원이 없습니다</div>';
}
function memberItem(m, pending = false) {
  return `<div class="mem card ${m.status === 'rest' ? 'rest' : ''} ${pending ? 'pending' : ''}" data-act="memberView" data-id="${m.id}">

}

function bindPosOrder(root) {
  const box = root.querySelector('.poschk'); if (!box) return;
  let order = box.dataset.order ? box.dataset.order.split(',').filter(Boolean) : [];
  box.addEventListener('change', e => {
    const v = e.target.value;
    if (e.target.checked) { if (!order.includes(v)) order.push(v); } else order = order.filter(x => x !== v);
    box.dataset.order = order.join(','); root.querySelector('.pos-order').textContent = order.join(' › ') || '없음';
  });
}
async function readMemberForm(form, existing, requirePin) {
  const f = new FormData(form);
  const name = (f.get('name') || '').trim();
  if (!name) { toast('이름을 입력하세요', 'err'); return null; }
  const dup = Store.list('members').find(x => x.name === name && x.id !== existing?.id);
  if (dup) { toast('같은 이름의 회원이 있습니다. 구분할 수 있게 입력해 주세요', 'err'); return null; }
  const order = (form.querySelector('.poschk').dataset.order || '').split(',').filter(Boolean);
  if (!order.length) { toast('선호 포지션을 하나 이상 고르세요', 'err'); return null; }
  const d = { name, number: f.get('number') === '' ? null : +f.get('number'), pos: order };
  const pin = f.get('pin'), pin2 = f.get('pin2');
  if (pin || requirePin) {
    if (!/^\d{4}$/.test(pin || '')) { toast('PIN은 숫자 4자리입니다', 'err'); return null; }
    if (pin !== pin2) { toast('PIN 확인이 일치하지 않습니다', 'err'); return null; }
    d.pinHash = await hashPin(pin);
  }
  if (f.has('role')) d.role = f.get('role');
  if (f.has('status')) d.status = f.get('status');
  if (f.has('joined')) d.joined = f.get('joined');
  if (f.has('memo')) d.memo = f.get('memo');
  return d;
}

  openLineup: d => { S.phase = 'def'; go({ type: 'lineup', id: d.id, q: 0 }); },

  matchDelete: async d => {

    const yes = lineupPool(m).yes;
    const nameToPid = {}; Store.list('members').forEach(x => nameToPid[x.name] = x.id); (m.guests || []).forEach(g => nameToPid[g.name] = g.id);

    const others = Store.list('members').filter(x => x.status !== 'pending' && !main.includes(x.id)).sort(byName).map(x => x.id);
    const all = [...main, ...others];

    const row = pid => { const pp = person(m, pid); const e = exRows[pid]; return `<div class="stat-row c4"><input type="checkbox" name="on_${pid}" ${on(pid) ? 'checked' : ''} aria-label="${esc(pp.name)} 출전"><span>${esc(memberLabel(pp))}${pp.guest ? ' <small class="muted">용병</small>' : ''}${qc[pid] ? ` <small class="muted">${qc[pid]}Q</small>` : ''}</span><input type="number" min="0" name="g_${pid}" value="${e?.g || ''}" placeholder="0" inputmode="numeric"><input type="number" min="0" name="a_${pid}" value="${e?.a || ''}" placeholder="0" inputmode="numeric"></div>`; };

      ${main.map(row).join('') || '<div class="muted" style="font-size:13px;padding:8px 0">참석자가 없습니다</div>'}
      ${others.length ? `<details><summary>그 외 회원 ${others.length}명 (응답 없이 참여한 경우)</summary>${others.map(row).join('')}</details>` : ''}
      <label class="f" style="margin-top:14px"><span>MVP</span><select name="mvp"><option value="">선정 안 함</option>${all.map(p => `<option value="${p}" ${mvpPid === p ? 'selected' : ''}>${esc(person(m, p).name)}</option>`).join('')}</select></label>
      <label class="f"><span>경기 메모</span><textarea name="resultMemo" rows="2" placeholder="경기 총평 등">${esc(memo)}</textarea></label>
      <p class="help" style="display:flex;gap:6px;align-items:flex-start;margin:-4px 0 12px">${I.sheet}<span>저장하면 ${Sheet.mode === 'demo' ? '데모 시트' : "구글 시트 '경기결과'·'개인기록' 탭"}에 기록됩니다. 같은 경기 기록이 있으면 덮어씁니다.</span></p>
      <button class="btn primary block" id="rfBtn">결과 저장 · 경기 종료 처리</button></form>`, el => {
      el.querySelector('#rf').onsubmit = async e => {
        e.preventDefault(); const f = new FormData(e.target); const mm = Store.get('matches', d.id); const btn = el.querySelector('#rfBtn');
        const sc = { us: +f.get('us') || 0, them: +f.get('them') || 0 };
        const parts = all.filter(p => f.get('on_' + p));
        const stats = {}; all.forEach(p => { const g = +f.get('g_' + p) || 0, a = +f.get('a_' + p) || 0; if (g || a) { stats[p] = { g, a }; if (!parts.includes(p)) parts.push(p); } });
        const mvp = f.get('mvp') || null; if (mvp && !parts.includes(mvp)) parts.push(mvp);
        const payload = buildSheetPayload(mm, sc, stats, mvp, parts, (f.get('resultMemo') || '').trim());
        btn.disabled = true; btn.textContent = '구글 시트에 저장 중…';
        try { await Sheet.post({ action: 'saveResult', ...payload }); }
        catch (err) {
          btn.disabled = false; btn.textContent = '결과 저장 · 경기 종료 처리';
          if (err.message === 'NOKEY') { closeSheet(); toast('구글 시트 쓰기 키를 먼저 입력하세요', 'err'); return ACT.sheetSettings(); }

        Sheet.applyLocal(payload);

        await Store.put('matches', mm); closeSheet(); toast(`경기 결과를 ${Sheet.mode === 'demo' ? '데모 시트' : '구글 시트'}에 저장했습니다`);

      <div class="memo" style="margin-bottom:14px">${Sheet.mode === 'live' ? `<b>연결된 웹 앱 URL</b><br><small style="word-break:break-all">${esc(SHEET_API_URL)}</small>` : 'index.html 의 <b>SHEET_API_URL</b> 이 비어 있어 <b>데모 시트</b>(이 브라우저에만 저장)로 동작 중입니다. README의 시트 연결 방법을 참고하세요.'}</div>

  /* 라인업 */
  slot: d => {
    if (Date.now() - S.dragEnd < 450) return;
    const m = Store.get('matches', S.view.id); const L = getLineup(m); const q = S.view.q || 0; const Q = L.quarters[q];
    const i = +d.i; const slots = slotsFor(m.format, Q.formation); const label = slots[i].label; const cat = CAT[label];
    const pool = lineupPool(m); const cnt = quarterCounts(L); const sn = Q.slotNotes[i]; const cur = person(m, Q.players[i]);
    const fitOf = p => (p.pos || [])[0] === cat ? 0 : (p.pos || []).includes(cat) ? 1 : 2;
    const sortIds = ids => ids.map(pid => ({ pid, p: person(m, pid) })).filter(x => x.p).sort((a, b) => fitOf(a.p) - fitOf(b.p) || (cnt[a.pid] || 0) - (cnt[b.pid] || 0) || byName(a.p, b.p));
    const item = ({ pid, p }) => {
      const where = Q.players.indexOf(pid); const fit = fitOf(p);
      return `<button class="pick ${where === i ? 'cur' : ''}" data-act="pick" data-p="${pid}"><span class="no">${p.number ?? ''}</span><b>${esc(p.name)}</b>${(p.pos || []).map((x, k) => `<span class="tag ${x} ${k ? 'sub' : ''}">${x}</span>`).join('')}${p.guest ? '<small class="muted">용병</small>' : ''}<span class="sp"></span>${where >= 0 && where !== i ? `<span class="here">${slots[where].label} 배치중</span>` : ''}${fit === 0 ? '<span class="fit main">주포지션</span>' : fit === 1 ? '<span class="fit sub">가능</span>' : ''}<span class="qc">${cnt[pid] || 0}Q</span></button>`;
    };
    S.pick = { mid: m.id, q, i };
    sheet(`${L.quarters.length > 1 ? (q + 1) + '쿼터 · ' : ''}${label} 포지션`, `
      <div class="slot-cur"><span class="tag ${cat}">${label}</span><span>${cur ? `<b>${esc(memberLabel(cur))}</b>` : '<span class="muted">선수 미배치</span>'}</span></div>
      <form id="snf"><h5>세부 지시사항 <small class="muted">· 선수가 아이콘을 누르면 팝업으로 봅니다</small></h5>
        <label class="f"><span>🛡 수비 시</span><textarea name="def" rows="2" placeholder="예) 상대 왼쪽 윙어 전담 마크, 라인 유지">${esc(sn.def)}</textarea></label>
        <label class="f"><span>⚔ 공격 시</span><textarea name="atk" rows="2" placeholder="예) 오버래핑 후 컷백, 역습 시 바로 전방 패스">${esc(sn.atk)}</textarea></label>
        <button class="btn navy block">지시사항 저장</button></form>
      <h5 style="margin-top:22px">선수 배치</h5>
      ${Q.players[i] ? `<button class="btn danger block" data-act="pick" data-p="" style="margin-bottom:12px">이 자리 비우기</button>` : ''}
      <h5>참석 ${pool.yes.length}명 <small class="muted">· 숫자는 이미 배정된 쿼터 수</small></h5>${sortIds(pool.yes).map(item).join('') || '<div class="muted" style="font-size:13px">참석자가 없습니다</div>'}
      ${pool.maybe.length ? `<h5>미정 ${pool.maybe.length}명</h5>${sortIds(pool.maybe).map(item).join('')}` : ''}
      ${pool.others.length ? `<details><summary>불참·미응답 회원 ${pool.others.length}명</summary>${sortIds(pool.others).map(item).join('')}</details>` : ''}`, el => {
      el.querySelector('#snf').onsubmit = async e => {
        e.preventDefault(); const f = new FormData(e.target); const mm = Store.get('matches', m.id); const LL = getLineup(mm);
        LL.quarters[q].slotNotes[i] = { def: f.get('def').trim(), atk: f.get('atk').trim() }; mm.lineup = LL;

  slotInfo: d => {

    const i = +d.i; const label = slotsFor(m.format, Q.formation)[i].label; const p = person(m, Q.players[i]); if (!p) return;

        <div style="width:${sw}px;height:${disc}px;margin:0 auto">${shirtSvg(label, { w: sw, empty: !p, gk, away: isAwayKit(m) && !gk })}</div>
        ${p ? `<div style="display:inline-block;margin-top:4px;background:#0E1E40;color:#F3EDDC;font:700 ${nfs}px/1.3 Pretendard;padding:2px 8px;border-radius:6px;white-space:nowrap">${esc(p.name)}</div><div style="font:700 ${small ? 10 : 13}px/1.2 'Barlow Condensed';color:#D8CCA8;letter-spacing:.06em">${s.label}</div>` : ''}
      </div>`;
    }).join('')}</div>`;
}

/* ---------- 확대/축소 잠금 ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* ---------- 당겨서 새로고침 ---------- */
const PTR = { el: null, y0: null, x0: 0, dy: 0, on: false };
function ptrEl() { if (!PTR.el) { PTR.el = document.createElement('div'); PTR.el.id = 'ptr'; PTR.el.innerHTML = `<div class="ptr-c">${I.refresh}</div>`; document.body.appendChild(PTR.el); } return PTR.el; }
document.addEventListener('touchstart', e => {
  PTR.y0 = null;
  if (e.touches.length !== 1 || window.scrollY > 0 || document.querySelector('.ov') || e.target.closest('.tok[data-drag],.qtabs,.filters,.tbl-wrap,input,textarea,select')) return;
  PTR.y0 = e.touches[0].clientY; PTR.x0 = e.touches[0].clientX; PTR.dy = 0; PTR.on = false;
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  if (PTR.y0 == null) return;
  const dy = e.touches[0].clientY - PTR.y0, dx = Math.abs(e.touches[0].clientX - PTR.x0);
  if (!PTR.on) {
    if (dy > 8 && dy > dx && window.scrollY <= 0) PTR.on = true;
    else { if (dy < -4 || dx > 12) PTR.y0 = null; return; }
  }
  e.preventDefault();
  const el = ptrEl(); PTR.dy = Math.min(dy * 0.5, 110);
  el.style.transition = 'none'; el.style.opacity = Math.min(1, PTR.dy / 35);
  el.style.transform = `translate(-50%, ${PTR.dy - 46}px)`;
  el.querySelector('svg').style.transform = `rotate(${PTR.dy * 4}deg)`;
  el.classList.toggle('ready', PTR.dy >= 70);
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!PTR.on) { PTR.y0 = null; return; }
  const el = ptrEl(); const go = PTR.dy >= 70; PTR.on = false; PTR.y0 = null; el.style.transition = '';
  if (go) { el.classList.add('spin'); el.style.transform = 'translate(-50%, 22px)'; setTimeout(hardRefresh, 380); }
  else { el.classList.remove('ready'); el.style.transform = ''; el.style.opacity = ''; }
});
function hardRefresh() {
  try { sessionStorage.setItem('fmfc_restore', JSON.stringify({ tab: S.tab, view: S.view, phase: S.phase, matchSeg: S.matchSeg, recYear: S.recYear })); } catch (e) { }
  location.reload();
}

/* ---------- 시작 ---------- */
history.replaceState({ v: null, tab: 'home' }, '');
try {
  const rs = JSON.parse(sessionStorage.getItem('fmfc_restore') || 'null'); sessionStorage.removeItem('fmfc_restore');
  if (rs) { Object.assign(S, { tab: rs.tab || 'home', phase: rs.phase || 'def', matchSeg: rs.matchSeg || 'up', recYear: rs.recYear || S.recYear }); history.replaceState({ v: null, tab: S.tab }, ''); if (rs.view) { S.view = rs.view; history.pushState({ v: rs.view, tab: S.tab }, ''); } }
} catch (e) { }
Sheet.init();
Store.init().catch(e => { console.error(e); app.innerHTML = `<div class="splash"><div style="color:#F3EDDC;text-align:center;padding:24px"><div class="wm" style="font-size:56px">FMFC</div><p>앱을 시작하지 못했습니다.<br><small>${esc(e.message)}</small></p></div></div>`; });
</script>
